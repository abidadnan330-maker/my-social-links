<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abidur Social Gallery - Upload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #121212; color: white; text-align: center; }
        .upload-section { margin: 30px auto; padding: 20px; border: 2px dashed #38bdf8; max-width: 400px; border-radius: 10px; }
        input[type="file"] { margin: 10px 0; }
        button { background-color: #38bdf8; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #555; }
        #status { margin-top: 10px; color: #38bdf8; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .media-item { max-width: 300px; border: 1px solid #333; padding: 10px; border-radius: 8px; background: #1e1e1e; }
        .media-item img, .media-item video { max-width: 100%; border-radius: 5px; }
        .media-item audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Abidur Social Gallery</h1>
    <p>এখানে আপনার ছবি, ভিডিও বা অডিও আপলোড করুন</p>

    <!-- আপলোড সেকশন -->
    <div class="upload-section">
        <input type="file" id="fileChooser" accept="image/*,video/*,audio/*">
        <br><br>
        <button id="uploadBtn">আপলোড করুন</button>
        <div id="status"></div>
    </div>

    <h2>গ্যালারি ভিউ</h2>
    <!-- আপলোড করা ফাইলগুলো এখানে স্বয়ংক্রিয়ভাবে দেখাবে -->
    <div class="gallery" id="galleryContainer"></div>

    <!-- ফায়ারবেস মডিউল লাইব্রেরি (CDN) -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref as dRef, push, onValue } from "https://gstatic.com";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://gstatic.com";

        // আপনার প্রজেক্টের আসল ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
          apiKey: "AIzaSyAc3tKQhRvK_re45VnDkRYPHY4OaYxHmpE",
          authDomain: "://firebaseapp.com",
          databaseURL: "https://abidur-social-gallery-default-rtdb.firebaseio.com",
          projectId: "abidur-social-gallery",
          storageBucket: "abidur-social-gallery.firebasestorage.app",
          messagingSenderId: "178553332132",
          appId: "1:178553332132:web:7a1c432a27dec45bef6131",
          measurementId: "G-SEMSVTX21D"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ করা
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const storage = getStorage(app);

        // HTML এলিমেন্ট ধরা
        const fileChooser = document.getElementById('fileChooser');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');
        const galleryContainer = document.getElementById('galleryContainer');

        // আপলোড বাটন ক্লিক হ্যান্ডলার
        uploadBtn.addEventListener('click', () => {
            const file = fileChooser.files[0];
            if (!file) {
                alert("দয়া করে প্রথমে একটি ফাইল সিলেক্ট করুন!");
                return;
            }

            // ফাইলের ইউনিক নাম তৈরি করা
            const fileRef = sRef(storage, 'gallery/' + Date.now() + '_' + file.name);
            
            uploadBtn.disabled = true;
            statusDiv.innerText = "আপলোড হচ্ছে... দয়া করে অপেক্ষা করুন।";

            // ১. Firebase Storage-এ ফাইল আপলোড করা
            uploadBytes(fileRef, file).then((snapshot) => {
                // ২. ফাইলের অনলাইন লিংক (URL) নেওয়া
                getDownloadURL(snapshot.ref).then((downloadURL) => {
                    
                    // ৩. লিংক এবং ফাইলের টাইপ Realtime Database-এ সেভ করা
                    const databaseRef = dRef(database, 'my_gallery');
                    push(databaseRef, {
                        fileUrl: downloadURL,
                        fileType: file.type,
                        uploadedAt: Date.now()
                    }).then(() => {
                        statusDiv.innerText = "সফলভাবে আপলোড সম্পন্ন হয়েছে! 🎉";
                        fileChooser.value = ''; // ইনপুট ক্লিয়ার করা
                        uploadBtn.disabled = false;
                    });
                });
            }).catch((error) => {
                console.error(error);
                statusDiv.innerText = "আপলোড ব্যর্থ হয়েছে। রুলস চেক করুন বা আবার চেষ্টা করুন।";
                uploadBtn.disabled = false;
            });
        });

        // ৪. ডাটাবেস থেকে ডেটা এনে রিয়েল-টাইমে গ্যালারিতে দেখানো
        const dbGalleryRef = dRef(database, 'my_gallery');
        onValue(dbGalleryRef, (snapshot) => {
            galleryContainer.innerHTML = ''; // আগের ভিউ খালি করা
            if (snapshot.exists()) {
                const data = snapshot.val();
                // লুপ চালিয়ে প্রতিটি ফাইল স্ক্রিনে রেন্ডার করা
                Object.values(data).reverse().forEach(item => {
                    const mediaCard = document.createElement('div');
                    mediaCard.className = 'media-item';

                    if (item.fileType.startsWith('image/')) {
                        mediaCard.innerHTML = `<img src="${item.fileUrl}" alt="Uploaded Image">`;
                    } else if (item.fileType.startsWith('video/')) {
                        mediaCard.innerHTML = `<video src="${item.fileUrl}" controls></video>`;
                    } else if (item.fileType.startsWith('audio/')) {
                        mediaCard.innerHTML = `<audio src="${item.fileUrl}" controls></audio>`;
                    }

                    galleryContainer.appendChild(mediaCard);
                });
            } else {
                galleryContainer.innerHTML = '<p>গ্যালারিতে কোনো ফাইল নেই।</p>';
            }
        });
    </script>
</body>
</html>
